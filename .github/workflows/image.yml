name: Image

# Built here, not on the server: the home server runs other services, and a
# Gradle build inside a small container there swapped hard enough to stall them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds the image so a broken Dockerfile fails review;
      # only main publishes. `main` is what the server runs, the commit tag is
      # what a rollback names.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/seeeeeeong/tickguard-kotlin:main
            ghcr.io/seeeeeeong/tickguard-kotlin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
