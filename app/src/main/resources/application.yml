server:
  # Finish in-flight requests on shutdown rather than cutting them.
  shutdown: graceful
  # Loopback by default: nothing here needs to be reachable from outside.
  address: ${TICKGUARD_METRICS_HOST:127.0.0.1}
  port: ${TICKGUARD_METRICS_PORT:9464}

management:
  endpoints:
    web:
      # The original served metrics at /metrics. Scrape configs point there.
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus, health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: tickguard
  config:
    # The original ran with `node --env-file=.env`. Variables set in the
    # environment still win over the file.
    import: optional:file:.env[.properties]
  lifecycle:
    # How long a drain may take before shutdown goes ahead without it.
    timeout-per-shutdown-phase: 30s
  main:
    banner-mode: off
