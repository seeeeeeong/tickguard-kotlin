version: 2

updates:
  # Reads gradle/libs.versions.toml, which build-logic shares.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # "chore(deps): bump …", which the PR title check accepts.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # detekt analyses with the Kotlin it was built against, 2.4.10 for
      # 2.0.0-alpha.6. Kotlin moves when detekt does, in one change.
      - dependency-name: 'org.jetbrains.kotlin*'
    groups:
      # Tests and linters move together; one PR a week rather than five.
      build-tooling:
        patterns: ['org.junit*', 'org.assertj*', 'dev.detekt*', 'com.diffplug.spotless*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
