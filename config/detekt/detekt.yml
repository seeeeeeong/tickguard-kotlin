# Only departures from detekt's defaults. Each one says which rule of the
# TypeScript original it carries over, or what the JVM adds.

complexity:
  # Biome's noExcessiveCognitiveComplexity was set to 12 in the original.
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 12
  # Options classes with defaults are the named-argument form of the
  # original's options objects: every clock, timer and callback injectable, and
  # most defaulted. Required parameters are still counted against the limit.
  LongParameterList:
    ignoreDefaultParameters: true
  # compareTo and toString are contracts a type fulfils, not surface it adds.
  # A numeric value type needs its operators plus those, and would be split
  # for no reader's benefit to fit a count that includes them.
  TooManyFunctions:
    ignoreOverridden: true

coroutines:
  # Tests pick real threads on purpose, to exercise a socket in real time.
  InjectDispatcher:
    excludes: ['**/test/**', '**/testFixtures/**']
  # The original linted floating promises. A coroutine launched on GlobalScope
  # is the same mistake: nothing awaits it and nothing stops it on shutdown.
  GlobalCoroutineUsage:
    active: true
  # Failures are isolated with broad catches throughout this codebase. On the
  # JVM each of those also catches cancellation, and a swallowed cancellation
  # is a shutdown that never finishes.
  SuspendFunSwallowedCancellation:
    active: true
  # A suspend call in `finally` does not run once the coroutine is cancelled,
  # which is exactly when cleanup is needed.
  SuspendFunInFinallySection:
    active: true

naming:
  # Kotlin's conventions name a file of several top-level declarations after
  # what it holds (Backoff.kt: the options, the default, the function). This
  # rule counts only classes and would rename it after the options.
  MatchingDeclarationName:
    active: false

style:
  # `?: return` at the top of a function is how untrusted input is refused
  # field by field here, as the original's early returns did. Guard clauses
  # are not the branching this rule is after.
  ReturnCount:
    excludeGuardClauses: true
  # An HTTP status is its own name: 403 reads as "forbidden" to anyone who
  # would touch this code, and HTTP_FORBIDDEN = 403 adds a hop, not meaning.
  # An enum entry names its own arguments: ACCOUNT(1) is the documented limit
  # for ACCOUNT, and a constant per entry would only repeat the table.
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '401', '403', '404', '408', '429', '500', '503']
    ignoreEnums: true
  # "No TODO/FIXME without an issue link", from the original's CLAUDE.md.
  ForbiddenComment:
    comments:
      - value: 'TODO'
        reason: 'Link an issue (https://github.com/seeeeeeong/tickguard-kotlin/issues/N) or do it now.'
      - value: 'FIXME'
        reason: 'Link an issue (https://github.com/seeeeeeong/tickguard-kotlin/issues/N) or fix it now.'
      - value: 'STOPSHIP'
        reason: 'Address this before merging.'
    allowedPatterns: 'github\.com/seeeeeeong/tickguard-kotlin/issues/\d+'
  ForbiddenMethodCall:
    active: true
    # Operator entry points print by design; everything else logs.
    excludes: ['**/tools/**']
    methods:
      - value: 'kotlin.io.print'
        reason: 'Use a logger. Only tools/ may print.'
      - value: 'kotlin.io.println'
        reason: 'Use a logger. Only tools/ may print.'
      - value: 'java.math.BigDecimal.<init>(kotlin.Double)'
        reason: 'A Double has already lost the digits. Prices arrive as strings for this reason.'
      - value: 'java.math.BigDecimal.<init>(kotlin.String)'
        reason: 'Throws NumberFormatException. Parse at the boundary with toBigDecimalOrNull().'
      - value: 'java.math.BigDecimal.equals'
        reason: 'Compares scale: 339.20 == 339.2 is false. Use compareTo, <, >= or signum().'
      - value: 'kotlin.text.toDouble'
        reason: 'Prices and volumes are decimals. Parse them as BigDecimal.'
      # Iteration order is behaviour here: the original iterated JS Maps, which
      # keep insertion order, and parity is checked byte for byte. mutableMapOf
      # and mutableSetOf keep insertion order; the hash-ordered ones do not.
      - value: 'java.util.HashMap.<init>'
        reason: 'Iteration order is observable. Use mutableMapOf() / LinkedHashMap.'
      - value: 'java.util.HashSet.<init>'
        reason: 'Iteration order is observable. Use mutableSetOf() / LinkedHashSet.'
      - value: 'kotlin.collections.hashMapOf'
        reason: 'Iteration order is observable. Use mutableMapOf().'
      - value: 'kotlin.collections.hashSetOf'
        reason: 'Iteration order is observable. Use mutableSetOf().'
      # Blocking the single engine thread stalls every consumer behind it, and
      # the order channel is closed after two seconds of that. Each of
      # XChange's recorded stream outages began with a block on its event loop.
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'Blocks a thread. Use a suspend function or a scope.'
      - value: 'java.lang.Thread.sleep'
        reason: 'Blocks a thread. Use delay().'
